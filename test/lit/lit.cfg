import os
import lit.formats
import lit.TestRunner

config.name = 'Safety Checks Plugin Tests'
config.test_format = lit.formats.ShTest()
config.suffixes = ['.c', '.cpp']

config.excludes = ['lit.cfg.py']

# Get the plugin path.
config.build_dir = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(__file__))), '_build')
config.plugin_path = os.path.join(config.build_dir, 'plugin/safety_checks_plugin.so')
config.compiler_driver = os.path.join(config.build_dir, 'compiler_wrapper/compiler_wrapper')

# Get system include paths from clang.
import subprocess
def extract_include_paths(clang_invocation):
    clang_output = subprocess.check_output(clang_invocation, stderr=subprocess.STDOUT, input=b'')
    include_paths = []
    for line in clang_output.decode().split('\n'):
        if 'search starts here:' in line:
            continue
        if 'End of search list' in line:
            break
        if line.strip().startswith('/'):
            include_paths.append(line.strip())

    return include_paths

include_paths_c   = extract_include_paths(['clang', '-v', '-E',              '-'])
include_paths_cpp = extract_include_paths(['clang', '-v', '-E', '-x', 'c++', '-'])

# Configure the test command.
# WARNING: LIT has a bug:  If pattern A is a prefix of pattern B, then attempts to use B will match A.
# Example:
#  config.substitutions.append(('%include_paths',     'aaa')))
#  config.substitutions.append(('%include_paths_cpp', 'bbb')))
#
#  "%include_paths_cpp" should expand to "bbb", but it expands to "aaa_cpp"!

config.substitutions.append(('%clang', 'clang'))  # This also turns %clang++ into clang++, because of the bug mentioned above.

include_path_c_str =   ' '.join(f'-I{path}' for path in include_paths_c)
include_path_cpp_str = ' '.join(f'-I{path}' for path in include_paths_cpp)

# Some header included by common c++ headers needs this set: ¯\_(ツ)_/¯
cpp_lib_defines = '-D__GCC_ATOMIC_TEST_AND_SET_TRUEVAL=1'

config.substitutions.append(('%rewrite_c_file',   f'clang -cc1         -load {config.plugin_path} -plugin safety-checks {include_path_c_str}'))
config.substitutions.append(('%rewrite_cpp_file', f'clang -cc1 -x c++  -load {config.plugin_path} -plugin safety-checks {include_path_cpp_str} {cpp_lib_defines}'))
config.substitutions.append(('%compiler_driver', f'env THNODE_PLUGIN_PATH={config.plugin_path} {config.compiler_driver}'))

config.substitutions.append(('%test_root_dir', os.path.dirname(__file__)))

# Running FileCheck on instrumented source files is tricky.
# The instrumented source files preserve CHECK lines.
# This causes tests to pass when they should fail.
# Use grep to remove the CHECK lines before running FileCheck.
config.substitutions.append(('%FileCheckSrc', 'grep -v \'// CHECK-\' | FileCheck '))

# Set the test output directory.
config.test_exec_root = '_out/test/lit'
